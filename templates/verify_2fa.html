<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify MFA - SecureFile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-lg border-0" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4 text-center">
            <h4 class="mb-3 text-dark fw-bold">Two-Step Verification</h4>
            <p class="text-muted mb-4">Open Google Authenticator and enter your 6-digit verification code.</p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="text" name="otp_code" class="form-control form-control-lg text-center mb-4 font-monospace tracking-wide" placeholder="• • • • • •" maxlength="6" autofocus required autocomplete="off">
                <button type="submit" class="btn btn-primary btn-lg w-100">Verify Device</button>
            </form>
        </div>
    </div>
</body>
</html>
