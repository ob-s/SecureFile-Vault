<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Setup MFA - SecureFile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm" style="max-width: 500px;">
        <div class="card-body p-5 text-center">
            <h4 class="fw-bold mb-3">Secure Your Account</h4>
            <p class="text-muted mb-4">Scan this QR code with the <strong>Google Authenticator</strong> app on your phone to set up Multi-Factor Authentication.</p>
            
            <img src="data:image/png;base64,{{ qr_code }}" class="img-fluid border rounded p-2 mb-4" alt="MFA QR Code">
            
            <p class="small text-muted mb-2">Can't scan the code? Enter this setup key manually:</p>
            <div class="bg-light p-2 rounded border mb-4 font-monospace fw-bold fs-5 text-primary">
                {{ secret }}
            </div>
            
            <a href="{{ url_for('login') }}" class="btn btn-success w-100">I have scanned it, proceed to Login</a>
        </div>
    </div>
</body>
</html>
